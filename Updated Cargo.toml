[dependencies]
# Network
lib-network = "0.1.0"

# Storage
lib-storage = "0.1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }

# Metrics
prometheus = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Parallel processing
rayon = "1.5"

# Logging
tracing = "0.1"
tracing-subscriber = "0.2"

# Concurrency
dashmap = "5.4"
bytes = "1.2"

# Cryptography (for ZK proofs)
bls = "0.2"
zk-proof = "0.1"
